<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Log – Mohd Sharib</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #dce3ea;
    --text: #1c2b3a;
    --muted: #4a6580;
    --accent: #1a56db;
    --accent-light: #ebf0fd;
    --office: #0e7490;
    --office-light: #e0f7fa;
    --remote: #6d28d9;
    --remote-light: #ede9fe;
    --danger: #dc2626;
    --header-bg: #1c2b3a;
    --header-text: #ffffff;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── PASSWORD SCREEN ───────────────────── */
  #lock-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
    background: var(--bg);
  }

  .lock-card {
    background: var(--surface);
    border: none;
    border-radius: 12px;
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 8px 40px rgba(28,43,58,0.12);
  }

  .lock-icon {
    font-size: 2.2rem;
    margin-bottom: 1rem;
  }

  .lock-card h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.65rem;
    font-weight: 400;
    margin-bottom: 0.3rem;
  }

  .lock-card .subtitle {
    font-size: 0.92rem;
    color: var(--muted);
    margin-bottom: 1.8rem;
  }

  .lock-card input[type="password"] {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    padding: 0.75rem 1rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--text);
    background: var(--bg);
    outline: none;
    text-align: center;
    letter-spacing: 0.15em;
    transition: border-color 0.15s;
    margin-bottom: 0.75rem;
  }

  .lock-card input[type="password"]:focus { border-color: var(--accent); }
  .lock-card input[type="password"].error { border-color: var(--danger); animation: shake 0.3s ease; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .btn-unlock {
    width: 100%;
    padding: 0.75rem;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }

  .btn-unlock:hover { opacity: 0.82; }
  .btn-unlock:disabled { opacity: 0.5; cursor: not-allowed; }

  .lock-error {
    font-size: 0.89rem;
    color: var(--danger);
    margin-top: 0.6rem;
    min-height: 1.2em;
  }

  /* ── MAIN APP ──────────────────────────── */
  #app {
    display: none;
    padding: 0 0 4rem;
  }

  header {
    background: var(--header-bg);
    padding: 1.2rem 2rem;
    margin-bottom: 2rem;
  }
  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--header-text);
    text-transform: uppercase;
  }

  header span { font-size: 0.83rem; color: rgba(255,255,255,0.55); letter-spacing: 0.06em; text-transform: uppercase; }

  .container { max-width: 760px; margin: 0 auto; padding: 0 1.25rem; }

  .setup-banner {
    background: #fffbeb;
    border: 1.5px solid #f59e0b;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
    color: #92400e;
    line-height: 1.6;
  }

  .setup-banner strong { font-weight: 500; display: block; margin-bottom: 0.3rem; }

  .setup-banner input {
    margin-top: 0.6rem;
    width: 100%;
    border: 1.5px solid #f59e0b;
    border-radius: 7px;
    padding: 0.5rem 0.75rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.93rem;
    background: #fffdf5;
    color: var(--text);
    outline: none;
  }

  .setup-banner button {
    margin-top: 0.5rem;
    padding: 0.5rem 1.2rem;
    background: #f59e0b;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.93rem;
    cursor: pointer;
    font-weight: 500;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.89rem;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    margin-bottom: 1.2rem;
    letter-spacing: 0.03em;
  }

  .status-pill.connected { background: var(--accent-light); color: var(--accent); }
  .status-pill.disconnected { background: #fef2f2; color: #c0392b; }
  .status-pill.loading { background: #f0f0f0; color: var(--muted); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .monthly-card {
    background: var(--surface);
    border: none;
    border-radius: 10px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 12px rgba(28,43,58,0.07);
    border: 2px solid var(--accent);
  }

  .monthly-card h2 { font-size: 0.87rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .nav-btn {
    background: none; border: 1.5px solid var(--border); border-radius: 7px;
    width: 28px; height: 28px; cursor: pointer; color: var(--muted);
    font-size: 0.97rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s; line-height: 1;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }

  .stat { text-align: center; }
  .stat .val { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 2.2rem; color: var(--accent); line-height: 1; font-weight: 600; }
  .stat .label { font-size: 0.89rem; color: var(--muted); margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.04em; }

  .add-card {
    background: var(--surface);
    border: none;
    border-radius: 10px;
    padding: 1.5rem 1.75rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 12px rgba(28,43,58,0.07);
  }

  .add-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    margin-bottom: 1.2rem;
    user-select: none;
  }
  .add-card-header:hover span { color: var(--text) !important; }
  .add-card h2 { font-size: 0.87rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0; }
  #add-form-body { overflow: hidden; transition: all 0.3s ease; }
  #add-form-body.collapsed { display: none; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 0.75rem; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }

  label { font-size: 0.89rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 0.35rem; }

  input[type="date"], input[type="time"], input[type="text"], textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1rem;
    font-weight: 300;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(26,86,219,0.1); outline: none; }
  textarea { resize: vertical; min-height: 72px; }

  .location-toggle { display: flex; gap: 0.5rem; }

  .location-btn {
    flex: 1; padding: 0.6rem; border-radius: 8px; border: 1.5px solid var(--border);
    background: var(--bg); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.93rem; font-weight: 400; color: var(--muted); transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 0.35rem;
  }

  .location-btn.active-office { background: var(--office-light); border-color: var(--office); color: var(--office); }
  .location-btn.active-remote { background: var(--remote-light); border-color: var(--remote); color: var(--remote); }

  .btn-add {
    width: 100%; margin-top: 0.75rem; padding: 0.75rem;
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1rem; font-weight: 400;
    cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s;
  }

  .btn-add:hover { opacity: 0.82; }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

  .section-title { font-size: 0.89rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }

  .entry-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .entry {
    background: var(--surface); border: none; border-radius: 8px;
    padding: 1rem 1.25rem; display: grid; grid-template-columns: auto 1fr;
    gap: 1rem; align-items: start; animation: fadeIn 0.2s ease;
    box-shadow: 0 1px 6px rgba(28,43,58,0.08);
    border-left: 3px solid var(--border);
    transition: border-color 0.15s;
  }
  .entry:hover { border-left-color: var(--accent); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .entry-date { text-align: center; min-width: 38px; }
  .entry-date .day { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.55rem; line-height: 1; color: var(--accent); font-weight: 600; }
  .entry-date .mon { font-size: 0.77rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .entry-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.3rem; }

  .badge { font-size: 0.79rem; padding: 0.2rem 0.55rem; border-radius: 20px; font-weight: 500; }
  .badge-office { background: var(--office-light); color: var(--office); }
  .badge-remote { background: var(--remote-light); color: var(--remote); }

  .entry-hours { font-size: 0.89rem; color: var(--muted); }
  .entry-duration { font-weight: 500; color: var(--accent); font-size: 0.89rem; }
  .entry-notes { font-size: 0.95rem; color: #555; line-height: 1.5; margin-top: 0.35rem; }



  .empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: 1rem; border: 1.5px dashed var(--border); border-radius: 10px; }
  .spinner { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.97rem; }

  .lock-btn {
    font-size: 0.89rem; color: var(--muted); background: none; border: 1.5px solid var(--border);
    border-radius: 20px; padding: 0.25rem 0.75rem; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif;
    transition: all 0.15s;
  }
  .lock-btn:hover { color: var(--danger); border-color: var(--danger); }

  @media (max-width: 520px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-row, .form-row.three { grid-template-columns: 1fr; }
    header h1 { font-size: 1.65rem; }
  }
</style>
</head>
<body>

<!-- ── LOCK SCREEN ───────── -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="lock-icon">🔒</div>
    <h1>Work Log</h1>
    <p class="subtitle">Mohd Sharib — Enter password to continue</p>

    <!-- Connection status on lock screen -->
    <div id="lock-conn-status" style="display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:1.2rem;flex-wrap:wrap;">
      <div style="display:inline-flex;align-items:center;gap:0.35rem;font-size:0.72rem;padding:0.25rem 0.65rem;border-radius:20px;background:#f0f0f0;color:#888580;" id="lock-status-pill">
        <div id="lock-status-dot" style="width:6px;height:6px;border-radius:50%;background:currentColor;"></div>
        <span id="lock-status-text">Checking connection...</span>
      </div>
      <button onclick="retryConnection()" id="lock-retry-btn" style="font-size:0.72rem;color:var(--muted);background:none;border:1.5px solid var(--border);border-radius:20px;padding:0.25rem 0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.15s;">↻ Retry</button>
    </div>

    <input type="password" id="password-input" placeholder="Enter password" onkeydown="if(event.key==='Enter') unlock()" id="password-input">
    <button class="btn-unlock" id="btn-unlock" onclick="unlock()">Unlock</button>
    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<!-- ── MAIN APP ───────── -->
<div id="app">

  <header>
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:1rem;">
        <div>
          <h1>Work Log</h1>
          <div style="font-size:0.75rem;color:rgba(255,255,255,0.55);margin-top:0.15rem;font-family:'Outfit',sans-serif;font-weight:300;letter-spacing:0.04em;">MOHD SHARIB &nbsp;·&nbsp; <span style="color:rgba(255,255,255,0.35);font-size:0.68rem;">V.1.5.1</span></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;">
        <span id="week-label"></span>
        <button class="lock-btn" onclick="lockApp()">🔒 Lock</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- Status -->
    <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:1.2rem;">
      <div class="status-pill loading" id="status-pill" style="margin-bottom:0;">
        <div class="status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
      <button onclick="loadEntries()" style="font-size:0.72rem;color:var(--muted);background:none;border:1.5px solid var(--border);border-radius:20px;padding:0.25rem 0.75rem;cursor:pointer;font-family:'DM Sans',sans-serif;">↻ Retry</button>
    </div>

    <!-- Monthly Summary -->
    <div class="section-title">Analytics</div>
    <div class="monthly-card">
      <div class="month-nav">
        <button class="nav-btn" onclick="changeMonth(-1)">&#8592;</button>
        <h2><span id="month-name"></span></h2>
        <button class="nav-btn" id="btn-next-month" onclick="changeMonth(1)">&#8594;</button>
      </div>
      <div class="stats-row">
        <div class="stat"><div class="val" id="stat-days">0</div><div class="label">Days Logged</div></div>
        <div class="stat"><div class="val" id="stat-hours">0h</div><div class="label">Total Hours</div></div>
        <div class="stat"><div class="val" id="stat-office">0</div><div class="label">In Office</div></div>
        <div class="stat"><div class="val" id="stat-remote">0</div><div class="label">Remote</div></div>
      </div>
    </div>

    <!-- Add Entry -->
    <div class="section-title">Log Entry</div>
    <div class="add-card" id="add-card">
      <div class="add-card-header" onclick="toggleForm()">
        <div style="display:flex;flex-direction:column;gap:0.2rem;">
          <h2 style="margin-bottom:0;"></h2>
          <span style="font-size:0.68rem;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;">🔒 Only for Sharib</span>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;">
          <span id="form-chevron" style="color:var(--muted);font-size:0.9rem;transition:transform 0.25s;transform:rotate(180deg);">▲</span>
        </div>
      </div>
      <div id="add-form-body" class="collapsed">
      <div class="form-row">
        <div>
          <label>Date</label>
          <input type="date" id="inp-date">
        </div>
        <div>
          <label>Location</label>
          <div class="location-toggle">
            <button class="location-btn active-office" id="btn-office" onclick="setLocation('office')">🏢 Office</button>
            <button class="location-btn" id="btn-remote" onclick="setLocation('remote')">🏠 Remote</button>
          </div>
        </div>
      </div>
      <div class="form-row three">
        <div><label>Start Time</label><input type="time" id="inp-start"></div>
        <div><label>End Time</label><input type="time" id="inp-end"></div>
        <div><label>Break (mins)</label><input type="text" id="inp-break" placeholder="e.g. 60"></div>
      </div>
      <div>
        <label>Work Updates / Notes</label>
        <textarea id="inp-notes" placeholder="What did you work on today?"></textarea>
      </div>
      <button class="btn-add" id="btn-add" onclick="addEntry()">+ Add Entry</button>
      </div>
    </div>

    <div class="section-title">All Entries</div>
    <div class="entry-list" id="entry-list">
      <div class="spinner" id="loading-msg">Loading entries...</div>
    </div>

  </div>
</div>

<script>
  const scriptUrl = 'https://script.google.com/macros/s/AKfycbx4s4Rp15B0l4Q2Q9SJLKsOSN6m7jnNoJtUrfAMbvoszEV9ahkVbKQIB-oRZnBVYOWxrw/exec';
  let entries = [];
  let selectedLocation = 'office';
  async function checkLockScreenConnection() {
    setLockStatus('checking', 'Checking connection...');
    try {
      const res = await fetch(scriptUrl + '?action=checkPassword&password=__ping__&t=' + Date.now());
      const data = await res.json();
      if (data.success !== undefined || data.error !== undefined) {
        setLockStatus('connected', 'Server connected ✓');
      } else {
        setLockStatus('error', 'Server error — retry');
      }
    } catch(err) {
      setLockStatus('error', 'Not connected — retry');
    }
  }

  function setLockStatus(type, text) {
    const pill = document.getElementById('lock-status-pill');
    const dot = document.getElementById('lock-status-dot');
    const span = document.getElementById('lock-status-text');
    span.textContent = text;
    if (type === 'connected') {
      pill.style.background = 'var(--accent-light)'; pill.style.color = 'var(--accent)';
    } else if (type === 'error') {
      pill.style.background = '#fef2f2'; pill.style.color = 'var(--danger)';
    } else {
      pill.style.background = '#f0f0f0'; pill.style.color = 'var(--muted)';
    }
  }

  function retryConnection() {
    const btn = document.getElementById('lock-retry-btn');
    btn.textContent = '↻ Retrying...';
    btn.disabled = true;
    checkLockScreenConnection().then(() => {
      btn.textContent = '↻ Retry';
      btn.disabled = false;
    });
  }

  async function unlock() {
    const input = document.getElementById('password-input');
    const errEl = document.getElementById('lock-error');
    const btn = document.getElementById('btn-unlock');
    const password = input.value.trim();

    if (!password) { errEl.textContent = 'Please enter a password.'; return; }
    btn.disabled = true;
    btn.textContent = 'Checking...';
    errEl.textContent = '';

    try {
      const res = await fetch(`${scriptUrl}?action=checkPassword&password=${encodeURIComponent(password)}&t=${Date.now()}`);
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('worklog_unlocked_until', Date.now() + 24 * 60 * 60 * 1000);
        showApp();
      } else {
        errEl.textContent = '❌ Incorrect password. Try again.';
        input.classList.add('error');
        setTimeout(() => input.classList.remove('error'), 400);
        input.value = '';
        input.focus();
      }
    } catch (err) {
      errEl.textContent = '⚠️ Could not connect. Check your setup.';
    }
    btn.disabled = false;
    btn.textContent = 'Unlock';
  }

  function lockApp() {
    localStorage.removeItem('worklog_unlocked_until');
    document.getElementById('app').style.display = 'none';
    document.getElementById('lock-screen').style.display = 'flex';
    document.getElementById('password-input').value = '';
    document.getElementById('lock-error').textContent = '';
    checkLockScreenConnection();
  }

  function showApp() {
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initApp();
  }

  document.addEventListener('DOMContentLoaded', function() {
    localStorage.removeItem('worklog_script_url');
    localStorage.removeItem('worklog_conn');

    const unlockedUntil = localStorage.getItem('worklog_unlocked_until');
    const isAutoUnlocked = unlockedUntil && Date.now() < parseInt(unlockedUntil);

    if (isAutoUnlocked) {
      showApp(); 
    } else {
      checkLockScreenConnection(); 
    }
  });
  function initApp() {
    document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];
    document.getElementById('inp-start').value = '09:00';
    document.getElementById('inp-end').value = '17:00';
    updateMonthLabel();
    document.getElementById('week-label').textContent = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

    setStatus('loading', 'Connecting...');
    loadEntries();
  }

  function setStatus(type, text) {
    document.getElementById('status-pill').className = 'status-pill ' + type;
    document.getElementById('status-text').textContent = text;
  }

  function setLocation(loc) {
    selectedLocation = loc;
    document.getElementById('btn-office').className = 'location-btn' + (loc === 'office' ? ' active-office' : '');
    document.getElementById('btn-remote').className = 'location-btn' + (loc === 'remote' ? ' active-remote' : '');
  }

  function calcHours(start, end, breakMins) {
    if (!start || !end) return null;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    const total = (eh * 60 + em) - (sh * 60 + sm) - (parseInt(breakMins) || 0);
    if (total <= 0) return null;
    const h = Math.floor(total / 60), m = total % 60;
    return { decimal: total / 60, label: m > 0 ? `${h}h ${m}m` : `${h}h` };
  }

  async function loadEntries(retryCount = 0) {
    if (!scriptUrl) return;
    setStatus('loading', 'Connecting...');
    try {
      const res = await fetch(`${scriptUrl}?action=getAll&t=${Date.now()}`, { cache: "no-store" });
      const data = await res.json();
      entries = data.entries || [];
      setStatus('connected', 'Connected to Google Sheets ✓');
      const lm = document.getElementById('loading-msg');
      if (lm) lm.style.display = 'none';
      render();
    } catch (err) {
      if (retryCount < 2) {
        // Auto-retry up to 2 times with a short delay
        setTimeout(() => loadEntries(retryCount + 1), 1500);
        setStatus('loading', `Retrying... (${retryCount + 1}/2)`);
      } else {
        setStatus('disconnected', 'Connection failed – click ↻ Retry');
        const lm = document.getElementById('loading-msg');
        if (lm) { lm.textContent = 'Could not connect. Click ↻ Retry.'; lm.style.display = 'block'; }
      }
    }
  }

  async function addEntry() {
    const date = document.getElementById('inp-date').value;
    const start = document.getElementById('inp-start').value;
    const end = document.getElementById('inp-end').value;
    const brk = document.getElementById('inp-break').value;
    const notes = document.getElementById('inp-notes').value.trim();
    if (!date) { alert('Please select a date.'); return; }
    if (!scriptUrl) { alert('Please connect to Google Sheets first.'); return; }

    const hours = calcHours(start, end, brk);
    const entry = { id: Date.now(), date, location: selectedLocation, start, end, break: brk, hours, notes };

    const btn = document.getElementById('btn-add');
    btn.disabled = true; btn.textContent = 'Saving...';

    try {
      await fetch(scriptUrl, { method: 'POST', body: JSON.stringify({ action: 'add', entry }) });
      entries.unshift(entry);
      document.getElementById('inp-notes').value = '';
      render();
    } catch (err) { alert('Failed to save. Check your connection.'); }

    btn.disabled = false; btn.textContent = '+ Add Entry';
  }



  let viewMonthOffset = 0;

  function changeMonth(dir) {
    const now = new Date();
    const newOffset = viewMonthOffset + dir;
    if (newOffset > 0) return;
    viewMonthOffset = newOffset;
    updateMonthLabel();
    renderStats();
  }

  function updateMonthLabel() {
    const now = new Date();
    const d = new Date(now.getFullYear(), now.getMonth() + viewMonthOffset, 1);
    document.getElementById('month-name').textContent = d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    document.getElementById('btn-next-month').disabled = viewMonthOffset === 0;
  }

  function getMonthRange() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth() + viewMonthOffset;
    return {
      start: new Date(y, m, 1),
      end: new Date(y, m + 1, 0, 23, 59, 59)
    };
  }

  function normalizeEntry(e) {

    if (e.date) {
      let d = null;
      if (typeof e.date === 'string' && e.date.match(/^\d{4}-\d{2}-\d{2}$/)) {

        d = null; // no change needed
      } else {
        const parsed = new Date(e.date);
        if (!isNaN(parsed.getTime())) {
          const yr = parsed.getFullYear();
          const mo = String(parsed.getMonth() + 1).padStart(2, '0');
          const dy = String(parsed.getDate()).padStart(2, '0');
          e.date = yr + '-' + mo + '-' + dy;
        }
      }
    }
    if (e.hours && typeof e.hours === 'string') {
      try { e.hours = JSON.parse(e.hours); } catch(err) { e.hours = null; }
    }

    if (e.start && typeof e.start !== 'string') {
      const t = new Date(e.start);
      if (!isNaN(t.getTime())) {
        e.start = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
      } else { e.start = ''; }
    }
    if (e.end && typeof e.end !== 'string') {
      const t = new Date(e.end);
      if (!isNaN(t.getTime())) {
        e.end = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
      } else { e.end = ''; }
    }
    return e;
  }

  function renderStats() {
    const { start, end } = getMonthRange();
    const thisMonth = entries.filter(e => { const d = new Date(e.date + 'T12:00:00'); return d >= start && d <= end; });
    const totalH = thisMonth.reduce((s, e) => s + (e.hours?.decimal || 0), 0);
    document.getElementById('stat-days').textContent = thisMonth.length;
    document.getElementById('stat-hours').textContent = totalH > 0 ? `${Math.round(totalH * 10) / 10}h` : '0h';
    document.getElementById('stat-office').textContent = thisMonth.filter(e => e.location === 'office').length;
    document.getElementById('stat-remote').textContent = thisMonth.filter(e => e.location === 'remote').length;
  }

  function render() {
    const list = document.getElementById('entry-list');

    entries = entries.map(normalizeEntry);

    renderStats();

    list.innerHTML = '';
    if (entries.length === 0) { list.innerHTML = '<div class="empty">No entries yet. Log your first day above!</div>'; return; }

    entries.forEach(e => {
      const d = new Date(e.date + 'T12:00:00');
      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = `
        <div class="entry-date">
          <div class="day">${d.getDate()}</div>
          <div class="mon">${d.toLocaleDateString('en-GB', { month: 'short' })}</div>
        </div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="badge ${e.location === 'office' ? 'badge-office' : 'badge-remote'}">${e.location === 'office' ? '🏢 Office' : '🏠 Remote'}</span>
            ${e.start && e.end ? `<span class="entry-hours">${e.start} – ${e.end}</span>` : ''}
            ${e.hours ? `<span class="entry-duration">· ${e.hours.label}</span>` : ''}
          </div>
          ${e.notes ? `<div class="entry-notes">${e.notes.toString().replace(/\n/g, '<br>')}</div>` : ''}
        </div>
`;
      list.appendChild(el);
    });
  }

  function toggleForm() {
    const body = document.getElementById('add-form-body');
    const chevron = document.getElementById('form-chevron');
    const hint = document.getElementById('form-toggle-hint');
    const collapsed = body.classList.toggle('collapsed');
    chevron.style.transform = collapsed ? 'rotate(180deg)' : 'rotate(0deg)';
  }
</script>
