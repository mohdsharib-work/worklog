<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Log – Mohd Sharib</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e5e0;
    --text: #1a1917;
    --muted: #888580;
    --accent: #2a6049;
    --accent-light: #e8f2ed;
    --office: #3b6ea5;
    --office-light: #e8eef6;
    --remote: #7a5c9e;
    --remote-light: #f0ebf8;
    --danger: #c0392b;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }

  header {
    max-width: 760px;
    margin: 0 auto 2.5rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--border);
    padding-bottom: 1.25rem;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    font-weight: 400;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  header span {
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .container { max-width: 760px; margin: 0 auto; }

  /* Setup Banner */
  .setup-banner {
    background: #fffbeb;
    border: 1.5px solid #f59e0b;
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    font-size: 0.84rem;
    color: #92400e;
    line-height: 1.6;
  }

  .setup-banner strong { font-weight: 500; display: block; margin-bottom: 0.3rem; }

  .setup-banner input {
    margin-top: 0.6rem;
    width: 100%;
    border: 1.5px solid #f59e0b;
    border-radius: 7px;
    padding: 0.5rem 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    background: #fffdf5;
    color: var(--text);
    outline: none;
  }

  .setup-banner button {
    margin-top: 0.5rem;
    padding: 0.5rem 1.2rem;
    background: #f59e0b;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    cursor: pointer;
    font-weight: 500;
  }

  /* Status pill */
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.72rem;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    margin-bottom: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.03em;
  }

  .status-pill.connected { background: var(--accent-light); color: var(--accent); }
  .status-pill.disconnected { background: #fef2f2; color: #c0392b; }
  .status-pill.loading { background: #f0f0f0; color: var(--muted); }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Weekly Summary */
  .monthly-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .monthly-card h2 {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 1rem;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
  }

  .stat { text-align: center; }

  .stat .val {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--text);
    line-height: 1;
  }

  .stat .label {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  /* Add Entry */
  .add-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .add-card h2 {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 1.2rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
  }

  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }

  label {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: block;
    margin-bottom: 0.35rem;
  }

  input[type="date"],
  input[type="time"],
  input[type="text"],
  textarea,
  select {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 300;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 72px; }

  .location-toggle { display: flex; gap: 0.5rem; }

  .location-btn {
    flex: 1;
    padding: 0.6rem;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 400;
    color: var(--muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }

  .location-btn.active-office { background: var(--office-light); border-color: var(--office); color: var(--office); }
  .location-btn.active-remote { background: var(--remote-light); border-color: var(--remote); color: var(--remote); }

  .btn-add {
    width: 100%;
    margin-top: 0.75rem;
    padding: 0.75rem;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 400;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }

  .btn-add:hover { opacity: 0.82; }
  .btn-add:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Entries */
  .section-title {
    font-size: 0.72rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.75rem;
  }

  .entry-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .entry {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 1rem;
    align-items: start;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .entry-date { text-align: center; min-width: 38px; }
  .entry-date .day { font-family: 'DM Serif Display', serif; font-size: 1.4rem; line-height: 1; color: var(--text); }
  .entry-date .mon { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  .entry-top { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.3rem; }

  .badge { font-size: 0.68rem; padding: 0.2rem 0.55rem; border-radius: 20px; font-weight: 500; letter-spacing: 0.03em; }
  .badge-office { background: var(--office-light); color: var(--office); }
  .badge-remote { background: var(--remote-light); color: var(--remote); }

  .entry-hours { font-size: 0.78rem; color: var(--muted); }
  .entry-duration { font-weight: 500; color: var(--accent); font-size: 0.78rem; }
  .entry-notes { font-size: 0.83rem; color: #555; line-height: 1.5; margin-top: 0.35rem; }

  .entry-actions { display: flex; gap: 0.3rem; align-self: center; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 0.2rem 0.35rem;
    border-radius: 5px;
    transition: all 0.12s;
  }

  .icon-btn:hover { color: var(--danger); background: #fef2f2; }

  .empty {
    text-align: center;
    padding: 2.5rem;
    color: var(--muted);
    font-size: 0.88rem;
    border: 1.5px dashed var(--border);
    border-radius: 10px;
  }

  .spinner {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  @media (max-width: 520px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .form-row, .form-row.three { grid-template-columns: 1fr; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Work Log</h1>
    <div style="font-size:0.82rem; color:var(--muted); margin-top:0.2rem; font-family:'DM Sans',sans-serif; font-weight:300;">Mohd Sharib</div>
  </div>
  <span id="week-label"></span>
</header>

<div class="container">

  <!-- Setup Banner -->
  <div class="setup-banner" id="setup-banner">
    <strong>⚙️ One-time Setup Required</strong>
    Paste your Google Apps Script Web App URL below to connect to Google Sheets.
    <input type="text" id="script-url-input" placeholder="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec">
    <button onclick="saveScriptUrl()">Connect to Google Sheets ✓</button>
  </div>

  <!-- Connection Status -->
  <div class="status-pill loading" id="status-pill">
    <div class="status-dot"></div>
    <span id="status-text">Not connected</span>
  </div>

  <!-- Monthly Summary -->
  <div class="monthly-card">
    <h2>This Month — <span id="month-name"></span></h2>
    <div class="stats-row">
      <div class="stat"><div class="val" id="stat-days">0</div><div class="label">Days Logged</div></div>
      <div class="stat"><div class="val" id="stat-hours">0h</div><div class="label">Total Hours</div></div>
      <div class="stat"><div class="val" id="stat-office">0</div><div class="label">In Office</div></div>
      <div class="stat"><div class="val" id="stat-remote">0</div><div class="label">Remote</div></div>
    </div>
  </div>

  <!-- Add Entry -->
  <div class="add-card">
    <h2>Log a Day</h2>
    <div class="form-row">
      <div>
        <label>Date</label>
        <input type="date" id="inp-date">
      </div>
      <div>
        <label>Location</label>
        <div class="location-toggle">
          <button class="location-btn active-office" id="btn-office" onclick="setLocation('office')">🏢 Office</button>
          <button class="location-btn" id="btn-remote" onclick="setLocation('remote')">🏠 Remote</button>
        </div>
      </div>
    </div>
    <div class="form-row three">
      <div>
        <label>Start Time</label>
        <input type="time" id="inp-start">
      </div>
      <div>
        <label>End Time</label>
        <input type="time" id="inp-end">
      </div>
      <div>
        <label>Break (mins)</label>
        <input type="text" id="inp-break" placeholder="e.g. 60">
      </div>
    </div>
    <div>
      <label>Work Updates / Notes</label>
      <textarea id="inp-notes" placeholder="What did you work on today?"></textarea>
    </div>
    <button class="btn-add" id="btn-add" onclick="addEntry()">+ Add Entry</button>
  </div>

  <!-- Entries -->
  <div class="section-title">All Entries</div>
  <div class="entry-list" id="entry-list">
    <div class="spinner" id="loading-msg">Loading entries...</div>
  </div>

</div>

<script>
  const SCRIPT_URL_KEY = 'worklog_script_url';
  let scriptUrl = localStorage.getItem(SCRIPT_URL_KEY) || '';
  let entries = [];
  let selectedLocation = 'office';

  // Init
  document.getElementById('inp-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('inp-start').value = '09:00';
  document.getElementById('inp-end').value = '17:00';
  document.getElementById('month-name').textContent = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
  document.getElementById('week-label').textContent = new Date().toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });

  if (scriptUrl) {
    document.getElementById('setup-banner').style.display = 'none';
    document.getElementById('script-url-input').value = scriptUrl;
    setStatus('loading', 'Connecting...');
    loadEntries();
  } else {
    document.getElementById('loading-msg').textContent = 'Connect to Google Sheets above to get started.';
    setStatus('disconnected', 'Not connected');
  }

  function saveScriptUrl() {
    const val = document.getElementById('script-url-input').value.trim();
    if (!val.startsWith('https://script.google.com')) {
      alert('Please enter a valid Google Apps Script URL.');
      return;
    }
    scriptUrl = val;
    localStorage.setItem(SCRIPT_URL_KEY, scriptUrl);
    document.getElementById('setup-banner').style.display = 'none';
    setStatus('loading', 'Connecting...');
    loadEntries();
  }

  function setStatus(type, text) {
    const pill = document.getElementById('status-pill');
    pill.className = 'status-pill ' + type;
    document.getElementById('status-text').textContent = text;
  }

  function setLocation(loc) {
    selectedLocation = loc;
    document.getElementById('btn-office').className = 'location-btn' + (loc === 'office' ? ' active-office' : '');
    document.getElementById('btn-remote').className = 'location-btn' + (loc === 'remote' ? ' active-remote' : '');
  }

  function calcHours(start, end, breakMins) {
    if (!start || !end) return null;
    const [sh, sm] = start.split(':').map(Number);
    const [eh, em] = end.split(':').map(Number);
    const total = (eh * 60 + em) - (sh * 60 + sm) - (parseInt(breakMins) || 0);
    if (total <= 0) return null;
    const h = Math.floor(total / 60);
    const m = total % 60;
    return { decimal: total / 60, label: m > 0 ? `${h}h ${m}m` : `${h}h` };
  }

  async function loadEntries() {
    if (!scriptUrl) return;
    try {
      const res = await fetch(`${scriptUrl}?action=getAll`);
      const data = await res.json();
      entries = data.entries || [];
      setStatus('connected', 'Connected to Google Sheets ✓');
      render();
    } catch (err) {
      setStatus('disconnected', 'Connection failed – check your URL');
      document.getElementById('loading-msg').textContent = 'Could not load entries. Check your Apps Script URL.';
      document.getElementById('loading-msg').style.display = 'block';
    }
  }

  async function addEntry() {
    const date = document.getElementById('inp-date').value;
    const start = document.getElementById('inp-start').value;
    const end = document.getElementById('inp-end').value;
    const brk = document.getElementById('inp-break').value;
    const notes = document.getElementById('inp-notes').value.trim();

    if (!date) { alert('Please select a date.'); return; }
    if (!scriptUrl) { alert('Please connect to Google Sheets first.'); return; }

    const hours = calcHours(start, end, brk);
    const entry = { id: Date.now(), date, location: selectedLocation, start, end, break: brk, hours, notes };

    const btn = document.getElementById('btn-add');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify({ action: 'add', entry }),
      });
      entries.unshift(entry);
      document.getElementById('inp-notes').value = '';
      render();
    } catch (err) {
      alert('Failed to save. Check your connection.');
    }

    btn.disabled = false;
    btn.textContent = '+ Add Entry';
  }

  async function deleteEntry(id) {
    if (!confirm('Delete this entry?')) return;
    if (!scriptUrl) return;

    try {
      await fetch(scriptUrl, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id }),
      });
      entries = entries.filter(e => e.id !== id);
      render();
    } catch (err) {
      alert('Failed to delete. Check your connection.');
    }
  }

  function getMonthRange() {
    const now = new Date();
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
    return { start, end };
  }

  function render() {
    const list = document.getElementById('entry-list');
    const { start, end } = getMonthRange();

    const thisMonth = entries.filter(e => {
      const d = new Date(e.date + 'T12:00:00');
      return d >= start && d <= end;
    });

    const totalH = thisMonth.reduce((s, e) => s + (e.hours?.decimal || 0), 0);
    document.getElementById('stat-days').textContent = thisMonth.length;
    document.getElementById('stat-hours').textContent = totalH > 0 ? `${Math.round(totalH * 10) / 10}h` : '0h';
    document.getElementById('stat-office').textContent = thisMonth.filter(e => e.location === 'office').length;
    document.getElementById('stat-remote').textContent = thisMonth.filter(e => e.location === 'remote').length;

    list.innerHTML = '';

    if (entries.length === 0) {
      list.innerHTML = '<div class="empty">No entries yet. Log your first day above!</div>';
      return;
    }

    entries.forEach(e => {
      const d = new Date(e.date + 'T12:00:00');
      const day = d.getDate();
      const mon = d.toLocaleDateString('en-GB', { month: 'short' });
      const badgeCls = e.location === 'office' ? 'badge-office' : 'badge-remote';
      const badgeLabel = e.location === 'office' ? '🏢 Office' : '🏠 Remote';
      const hoursStr = e.start && e.end ? `${e.start} – ${e.end}` : '';
      const durStr = e.hours ? `· ${e.hours.label}` : '';

      const el = document.createElement('div');
      el.className = 'entry';
      el.innerHTML = `
        <div class="entry-date">
          <div class="day">${day}</div>
          <div class="mon">${mon}</div>
        </div>
        <div class="entry-body">
          <div class="entry-top">
            <span class="badge ${badgeCls}">${badgeLabel}</span>
            ${hoursStr ? `<span class="entry-hours">${hoursStr}</span>` : ''}
            ${durStr ? `<span class="entry-duration">${durStr}</span>` : ''}
          </div>
          ${e.notes ? `<div class="entry-notes">${e.notes.toString().replace(/\n/g, '<br>')}</div>` : ''}
        </div>
        <div class="entry-actions">
          <button class="icon-btn" onclick="deleteEntry(${e.id})" title="Delete">✕</button>
        </div>
      `;
      list.appendChild(el);
    });
  }
</script>
</body>
</html>
